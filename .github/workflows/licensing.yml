name: licensing

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: REUSE compliance (every file has a licence)
        run: |
          python -m pip install --disable-pip-version-check reuse==6.3.0
          reuse lint
      - name: Check source licences and derived files
        run: python -m licensing check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
