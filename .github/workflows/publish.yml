name: publish

# Rebuilds the lists and force-pushes them to the `dist` branch.
# Scheduled runs only fire from the default branch (main).
# A push to main that changes the data or the build publishes straight away,
# so an entry added to data/allow.txt is unblocked within minutes.
# A push to any other branch runs a trial build of every list against the live
# sources and reports it, but publishes nothing.
on:
  push:
    branches-ignore: [dist]
    paths:
      - "pipeline/**"
      - "licensing/**"
      - "data/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "7 * * * *"           # complement + early-warning, hourly, off the hour
    - cron: "19 3,11,19 * * *"    # all three, every 8 hours (HaGeZi: Expires 8 hours)
  workflow_dispatch:
    inputs:
      builds:
        description: Builds to rebuild
        type: choice
        default: "complement,early-warning"
        options: ["complement,early-warning", "complement,early-warning,all-in-one"]
      allow_swing:
        description: Accept sources and builds that changed size more than their checks allow (30%)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write      # to delete superseded copies of the domain memory from the Actions cache

concurrency:
  # Trial builds queue per branch and never hold up a real publish.
  group: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && format('trial-{0}', github.ref) || 'publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Check out the current dist branch
        run: |
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git fetch --depth 1 origin dist:refs/remotes/origin/dist
            git worktree add --detach dist origin/dist
          else
            git worktree add --detach dist HEAD
            git -C dist rm -rq --cached . && find dist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Reference data (Public Suffix List, Tranco) is used but never published,
      # so it lives in the private Actions cache, not on the dist branch.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: refdata-${{ steps.day.outputs.day }}
          restore-keys: refdata-

      # The early-warning detector's memory of domains it has seen certificates
      # for (pipeline/seen.py). Private like the reference data, but it changes
      # every run, so each run saves a fresh copy and deletes the older ones.
      - uses: actions/cache/restore@v6
        with:
          path: .ct-seen
          key: ct-seen-${{ github.run_id }}
          restore-keys: ct-seen-

      - name: Build
        id: build
        env:
          BUILDS: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.builds
                || (github.event_name == 'push' && 'complement,early-warning,all-in-one')
                || (github.event.schedule == '19 3,11,19 * * *' && 'complement,early-warning,all-in-one'
                    || 'complement,early-warning') }}
          ALLOW_SWING: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_swing && '--allow-swing' || '' }}
        run: python -m pipeline build --builds "$BUILDS" --dist dist --cache .cache --seen .ct-seen $ALLOW_SWING

      # Publish whatever passed its gates, even if another build failed. The
      # branch has no history: each run replaces it, so the repo doesn't grow.
      - name: Publish to the dist branch
        if: >-
          always() && steps.build.outcome != 'skipped'
          && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        run: |
          cd dist
          test -f state/state.json || { echo "nothing built"; exit 0; }
          rm -rf .tmp-* .old-*            # leftovers if a build was interrupted
          git checkout -q --orphan publish
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Lists built $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force origin publish:dist

      - name: Save the domain memory
        if: >-
          always() && steps.build.outcome != 'skipped'
          && github.ref == 'refs/heads/main' && hashFiles('.ct-seen/meta.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .ct-seen
          key: ct-seen-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete older copies of the domain memory
        if: >-
          always() && steps.build.outcome != 'skipped'
          && github.ref == 'refs/heads/main' && hashFiles('.ct-seen/meta.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key ct-seen- --sort created_at --order desc \
              --limit 100 --json id --jq '.[1:][].id' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
