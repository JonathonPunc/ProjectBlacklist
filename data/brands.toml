# Brands the early-warning detector watches for in new certificates.
#
# strong  distinctive names: any hostname containing one (after undoing
#         look-alike tricks such as 0->o, rn->m and lookalike Unicode letters)
#         scores high. Also matched with one typo (paypai, netfiix).
#         Names listed in `word_start` too only count at the start of a word
#         (icloud-verify, not multicloud).
# weak    names that are also ordinary words: they only count as a whole
#         word (chase-login, not purchased), and need other evidence too.
# domains registrable domains the brand really owns. Hosts on them are never
#         flagged. Not exhaustive: popular-site checks (Tranco) and
#         data/allow.txt also protect real brand sites.
#
# Edit freely; the detector reloads this file on every run.


# Words phishing hostnames pair with a brand: each adds a little to the score.
keywords = [
  "login", "logon", "signin", "sign-in", "verify", "verification", "validate", "secure",
  "security", "account", "accounts", "update", "confirm", "support", "helpdesk", "wallet",
  "recover", "recovery", "restore", "unlock", "unlocked", "suspended", "suspend", "limited",
  "billing", "payment", "invoice", "refund", "claim", "reward", "auth", "authenticate",
  "session", "password", "reset", "webscr", "customer", "service", "alert", "notice",
  "delivery", "redelivery", "parcel", "package", "tracking", "toll", "tolls", "fee", "fees",
  "kyc", "2fa", "mfa",
]

# Ordinary words that contain or nearly spell a brand name: finance (binance),
# interactive (interac), revolution (revolut). They're blanked out before matching.
not_brands = [
  "finance", "financial", "betflix", "interactive", "interaction", "interact", "revolution",
  "revolutionary", "revolutions", "cloudy", "fedexfield", "enpass", "applied", "applies",
]

# Hostnames with these words are VPN or proxy tunnels that borrow a brand's
# domain to slip past network filters, not phishing pages. Not flagged.
tunnel_words = ["vpn", "vless", "vmess", "trojan", "v2ray", "xray", "ssh", "proxy", "tunnel", "socks"]

# Top-level domains where abuse is far above average (Interisle and Spamhaus
# reports). Being on one adds a little to the score; on its own it means nothing.
risky_tlds = [
  "top", "xyz", "shop", "online", "site", "live", "click", "icu", "cfd", "sbs", "bond",
  "buzz", "cyou", "rest", "support", "help", "vip", "lol", "mom", "today", "world", "xin",
  "work", "fun", "store", "life", "win", "asia", "monster", "autos", "boats", "homes",
  "motorcycles", "yachts", "beauty", "hair", "skin", "makeup", "quest", "zip", "mov",
]

