  "Credit phishunt.io when redistributing (ToS section 7: appreciated, not required).",
  "Send false-positive disputes to phishunt's GitHub issues with its false-positive template (ToS section 6).",
]
notes = """ToS section 7 releases the feed data under CC0 1.0; attribution is
appreciated but not required. phishunt itself aggregates Certificate
Transparency logs and third-party feeds."""

