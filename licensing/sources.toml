[[sources]]
id = "cert-pl"
name = "CERT Polska Warning List"
status = "approved"
license = "LicenseRef-CERT-PL-Data-Usage-Policy"
builds = ["complement", "all-in-one"]
homepage = "https://cert.pl/en/warning-list/"
url = "https://hole.cert.pl/domains/v2/domains.txt"
terms_url = "https://cert.pl/en/warning-list/"
verified = 2026-11-14
attribution = """Listed as a data source only. No cooperation, partnership,
endorsement, certification or support by NASK-PIB or CERT Polska is implied."""
conditions = [
  "Never imply cooperation, partnership, endorsement, certification or support by NASK-PIB or CERT Polska (data usage policy).",
  "Don't use NASK-PIB or CERT Polska names, designations or logos in any way that could mislead about our relationship (data usage policy).",
]
requests = [
  "Block subdomains of listed domains too, but not their parents (CERT Polska implementation guidance).",
]
notes = """Government-run (NASK-PIB) list, mostly Polish-targeted phishing but it
also catches global brands. Entries expire after 6 months upstream.
hole.cert.pl was often unreachable on 2026-11-14, so the pipeline keeps its
last good copy."""

