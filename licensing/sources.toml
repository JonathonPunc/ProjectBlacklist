url = "https://phishunt.io/feed.txt"
terms_url = "https://phishunt.io/tos/"
verified = 2026-11-14
conditions = [
  "Describe entries as suspected, never as confirmed phishing (phishunt ToS sections 3 and 4).",
  "Don't misrepresent where the data came from (ToS section 4).",
  "Stay under 10 requests per second (ToS section 5).",
]
