# ProjectBlacklist source registry.
#
# Every feed the pipeline may touch is declared here: what licence it carries,
# whether its terms have been checked, and which published builds it may feed.
# `python -m licensing check` enforces the rules below; LICENSING.md explains
# them. After editing, run `python -m licensing sync` to regenerate NOTICE and
# the source table in LICENSING.md.
#
# status
#   approved  terms checked; may feed the builds listed in `builds`
#   pending   terms unclear or unread; feeds nothing until resolved
#   excluded  checked and rejected (terms, scope or quality); feeds nothing
#   internal  used by the pipeline (e.g. as an allowlist), never shipped
#
# license    SPDX identifier, or LicenseRef-* for custom terms
# verified   date someone last read the source's licence AND terms of use
# conditions obligations that come with the data, beyond the licence itself
# requests   things the maintainers ask for that no licence requires; we
#            honour them anyway (see "Respecting list maintainers" in
#            LICENSING.md)

# ---------------------------------------------------------------- builds ---

[builds.complement]
license = "CC0-1.0"
description = "Fast list from public-domain sources and our own curation, meant to run alongside HaGeZi TIF."

[builds.all-in-one]
license = "GPL-3.0-only"
description = "complement plus redistributable third-party lists, for people who want a single URL."

# ----------------------------------------------------------- custom terms ---
# Terms that aren't an SPDX licence. Each says which build licences it can go
# into; `check` uses that alongside the SPDX rules in licensing/registry.py.

[licenses."LicenseRef-CERT-PL-Data-Usage-Policy"]
name = "CERT Polska Warning List data usage policy"
url = "https://cert.pl/en/warning-list/"
compatible_with = ["CC0-1.0", "GPL-3.0-only"]
notice_required = false
summary = """The list "may be used by any user for any purpose, including
commercial purposes"; attribution is not required. Identifying the source must
not imply cooperation or endorsement by NASK-PIB or CERT Polska."""

